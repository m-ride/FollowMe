services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: finanzas
      POSTGRES_DB: finanzas
    ports: ["5433:5432"]  # 5433 en el host: 5432 suele estar ocupado
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:finanzas@db:5432/finanzas?sslmode=disable
      APP_TOKEN: ${APP_TOKEN:-dev}
    ports: ["8081:8080"]  # 8081 en el host: 8080 suele estar ocupado
    depends_on:
      db: {condition: service_healthy}
